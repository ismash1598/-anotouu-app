<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!--#artifact-start-->
<title>Teste de Caminhada</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" />
<style>
  /* Jogo: assume o escuro de propósito, para o campo verde saltar. */
  :root{
    --bg:#11150E;
    --surface:#1A2015;
    --surface-2:#232B1C;
    --ink:#E9F0DD;
    --ink-2:#98A786;
    --ink-3:#6B7A5B;
    --line:#2B3420;
    --line-2:#3C4A2C;
    --accent:#9BD64A;
    --accent-ink:#11150E;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{overscroll-behavior:none}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Barlow","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .app{max-width:520px;margin:0 auto;padding-inline:14px;padding-block:16px 28px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{
    margin:0;font-family:"Silkscreen",monospace;font-weight:700;
    font-size:16px;letter-spacing:.02em;color:var(--accent);
  }
  header span{
    font-family:"Silkscreen",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.06em;
  }

  .tela{
    margin-top:12px;position:relative;border:2px solid var(--line-2);border-radius:6px;
    overflow:hidden;background:#3E5F28;
    box-shadow:inset 0 0 0 2px #0C0F08, 0 14px 34px -18px #000;
  }
  canvas{display:block;width:100%;height:auto;touch-action:none}

  .hud{
    position:absolute;left:8px;top:8px;display:flex;gap:6px;pointer-events:none;
  }
  .hud b{
    font-family:"Silkscreen",monospace;font-weight:400;font-size:10px;
    background:rgba(10,14,7,.7);color:var(--accent);padding:4px 7px;border-radius:3px;
    letter-spacing:.04em;
  }

  .dpad{
    margin:16px auto 0;display:grid;width:min(258px,74vw);
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;
  }
  .dpad button{
    aspect-ratio:1;border:2px solid var(--line-2);background:var(--surface);
    border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);
    touch-action:none;-webkit-tap-highlight-color:transparent;
  }
  .dpad button:active, .dpad button.ativo{
    background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  }
  .dpad button svg{width:44%;height:44%}
  .dpad .vazio{visibility:hidden}
  .dpad .miolo{
    border-style:dashed;background:transparent;cursor:default;
    font-family:"Silkscreen",monospace;font-size:9px;color:var(--ink-3);letter-spacing:.04em;
  }
  .dpad .miolo:active{background:transparent;border-color:var(--line-2);color:var(--ink-3)}

  .rodape{margin-top:18px;color:var(--ink-2);font-size:13.5px;line-height:1.55}
  .rodape p{margin:0 0 7px}
  .rodape b{color:var(--ink)}
  .rodape .atalho{
    font-family:"Silkscreen",monospace;font-size:10px;background:var(--surface-2);
    border:1px solid var(--line-2);border-radius:4px;padding:2px 5px;color:var(--ink-2);
  }

  .velocidade{
    margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;display:flex;align-items:center;gap:11px;
  }
  .velocidade label{
    font-family:"Silkscreen",monospace;font-size:9.5px;color:var(--ink-3);
    letter-spacing:.06em;flex:none;
  }
  .velocidade input{flex:1;min-width:0;accent-color:var(--accent)}
  .velocidade output{
    font-family:"Silkscreen",monospace;font-size:10px;color:var(--ink-2);
    width:52px;text-align:right;flex:none;
  }

  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
<!--#artifact-split-->
</head>
<body>
<!--#artifact-resume-->
<div class="app">
  <header>
    <h1>TESTE DE CAMINHADA</h1>
    <span>8 FRAMES · 4 DIRECOES</span>
  </header>

  <div class="tela">
    <canvas id="jogo"></canvas>
    <div class="hud">
      <b id="hud-pos">X 0  Y 0</b>
      <b id="hud-dir">SUL</b>
    </div>
  </div>

  <div class="dpad" id="dpad">
    <span class="vazio"></span>
    <button type="button" data-dir="norte" aria-label="Andar para o norte">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 22 17H2z"/></svg>
    </button>
    <span class="vazio"></span>
    <button type="button" data-dir="oeste" aria-label="Andar para o oeste">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 12 17 2v20z"/></svg>
    </button>
    <button type="button" class="miolo" disabled>PARADO</button>
    <button type="button" data-dir="leste" aria-label="Andar para o leste">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12 7 22V2z"/></svg>
    </button>
    <span class="vazio"></span>
    <button type="button" data-dir="sul" aria-label="Andar para o sul">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21 2 7h20z"/></svg>
    </button>
    <span class="vazio"></span>
  </div>

  <div class="velocidade">
    <label for="vel">PASSO</label>
    <input type="range" id="vel" min="140" max="520" step="10" value="300" />
    <output id="vel-val">300ms</output>
  </div>

  <div class="rodape">
    <p>Segure um botão para andar sem parar. Um toque dá <b>um passo</b>, casa por casa.</p>
    <p>No teclado: <span class="atalho">SETAS</span> ou <span class="atalho">WASD</span>.</p>
  </div>
</div>

  /* A folha recortada: 8 colunas de frames, 4 linhas de direção,
     na mesma ordem em que vieram na imagem original. */
  var CEL_W = 59, CEL_H = 97, FRAMES = 8;
  var DIRS = ["norte", "leste", "sul", "oeste"];
  var LINHA = { norte:0, leste:1, sul:2, oeste:3 };
  var PASSO = { norte:[0,-1], leste:[1,0], sul:[0,1], oeste:[-1,0] };

  var TILE = 32;                 /* tamanho lógico da casa */
  var ALVO_COLUNAS = 11;         /* quantas casas caber na largura */

  var canvas = document.getElementById("jogo");
  var ctx = canvas.getContext("2d");

  var folha = new Image();
  var folhaPronta = false;
  folha.onload = function(){ folhaPronta = true; };
  folha.src = SPRITES;

  /* ---------------- estado ---------------- */
  var jog = {
    tx:0, ty:0,          /* casa atual */
    ox:0, oy:0,          /* casa de onde saiu, durante o passo */
    dir:"sul",
    andando:false,
    t:0,                 /* progresso do passo, 0 a 1 */
    frame:0,
    ciclo:0              /* avança sempre, para o passo seguinte continuar a perna certa */
  };
  var segurando = null;
  var duracaoPasso = 300;

  /* ---------------- grama ---------------- */
  /* Hash estável por casa: o campo é infinito mas sempre igual no mesmo lugar. */
  function hash(x, y){
    var n = (x * 374761393 + y * 668265263) | 0;
    n = (n ^ (n >>> 13)) | 0;
    n = Math.imul(n, 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  var VARIANTES = [], tamCasa = 0;

  function construirGrama(px){
    VARIANTES = [];
    /* Base única para todas as casas. Se cada casa tivesse a própria cor de
       fundo, a grade do mapa apareceria na tela feito colcha de retalhos. */
    var BASE = "#5C8F35";
    var N = 16;
    for (var v = 0; v < N; v++){
      var c = document.createElement("canvas");
      c.width = px; c.height = px;
      var g = c.getContext("2d");
      g.fillStyle = BASE;
      g.fillRect(0, 0, px, px);

      /* salpico miúdo: dá textura sem fechar bloco de cor */
      for (var i = 0; i < 26; i++){
        var sx = hash(v * 53 + i, i * 11) * px;
        var sy = hash(i * 17, v * 29 + i) * px;
        var claro = hash(v + i, i) > .5;
        g.fillStyle = claro ? "rgba(255,255,255,.045)" : "rgba(0,0,0,.055)";
        var t = Math.max(1, px * .085);
        g.fillRect(Math.floor(sx), Math.floor(sy), t, t);
      }

      /* tufos de capim */
      var tufos = 3 + Math.floor(hash(v * 71, 13) * 3);
      for (var t2 = 0; t2 < tufos; t2++){
        var tx = hash(v * 17 + t2, 3) * (px - 8) + 4;
        var ty = hash(t2, v * 23) * (px - 8) + 4;
        g.strokeStyle = hash(t2, v) > .5 ? "#4C7B2C" : "#6FA345";
        g.lineWidth = Math.max(1, px * .04);
        g.lineCap = "round";
        g.beginPath();
        g.moveTo(tx, ty + px * .09);
        g.lineTo(tx + px * .03, ty - px * .03);
        g.moveTo(tx + px * .065, ty + px * .09);
        g.lineTo(tx + px * .05, ty - px * .045);
        g.stroke();
      }

      /* alguns enfeites, esparsos o bastante para não virar padrão */
      if (v === 3 || v === 8 || v === 13){
        var fx = px * (.3 + hash(v, 5) * .45), fy = px * (.28 + hash(5, v) * .42);
        g.fillStyle = v === 8 ? "#E4879F" : "#E9DC5A";
        g.beginPath(); g.arc(fx, fy, Math.max(1.4, px * .05), 0, 6.3); g.fill();
        g.fillStyle = "rgba(255,255,255,.75)";
        g.beginPath(); g.arc(fx - px * .017, fy - px * .017, Math.max(.8, px * .02), 0, 6.3); g.fill();
      }
      if (v === 6){
        g.fillStyle = "#8C927E";
        g.beginPath(); g.ellipse(px * .36, px * .6, px * .1, px * .075, .3, 0, 6.3); g.fill();
        g.fillStyle = "rgba(255,255,255,.26)";
        g.beginPath(); g.ellipse(px * .33, px * .575, px * .05, px * .032, .3, 0, 6.3); g.fill();
      }
      if (v === 11){
        g.fillStyle = "rgba(90,74,42,.13)";
        g.beginPath(); g.ellipse(px * .55, px * .45, px * .3, px * .22, .6, 0, 6.3); g.fill();
      }
      VARIANTES.push(c);
    }
    tamCasa = px;
  }

  /* ---------------- tamanho da tela ---------------- */
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var larguraCSS = 0, alturaCSS = 0, escala = 1;

  function redimensionar(){
    var caixa = canvas.parentElement.getBoundingClientRect();
    larguraCSS = Math.max(240, Math.floor(caixa.width));
    alturaCSS = Math.round(larguraCSS * 0.92);
    canvas.style.height = alturaCSS + "px";
    canvas.width = Math.round(larguraCSS * dpr);
    canvas.height = Math.round(alturaCSS * dpr);
    escala = (larguraCSS / (ALVO_COLUNAS * TILE)) * dpr;
    construirGrama(Math.ceil(TILE * escala));
  }
  window.addEventListener("resize", redimensionar);

  /* ---------------- desenho ---------------- */
  function desenhar(){
    var T = tamCasa;
    var cw = canvas.width, ch = canvas.height;

    /* câmera presa no boneco: o mapa é que corre por baixo */
    var camX = jog.andando ? jog.ox + (jog.tx - jog.ox) * jog.t : jog.tx;
    var camY = jog.andando ? jog.oy + (jog.ty - jog.oy) * jog.t : jog.ty;

    var cols = Math.ceil(cw / T) + 2, rows = Math.ceil(ch / T) + 2;
    var base = { x:cw / 2 - T / 2 - camX * T, y:ch / 2 - T / 2 - camY * T };
    var ix0 = Math.floor(-base.x / T) - 1, iy0 = Math.floor(-base.y / T) - 1;

    for (var gy = 0; gy < rows + 1; gy++){
      for (var gx = 0; gx < cols + 1; gx++){
        var wx = ix0 + gx, wy = iy0 + gy;
        var v = VARIANTES[Math.floor(hash(wx, wy) * VARIANTES.length) % VARIANTES.length];
        ctx.drawImage(v, Math.round(base.x + wx * T), Math.round(base.y + wy * T), T, T);
      }
    }

    /* boneco sempre no meio */
    var px = cw / 2, py = ch / 2;
    var altura = T * 1.78;
    var largura = altura * (CEL_W / CEL_H);
    var pes = py + T * 0.30;

    ctx.save();
    ctx.globalAlpha = .28;
    ctx.fillStyle = "#12220A";
    ctx.beginPath();
    ctx.ellipse(px, pes - T * .04, largura * .30, T * .12, 0, 0, 6.3);
    ctx.fill();
    ctx.restore();

    if (folhaPronta){
      var sx = jog.frame * CEL_W;
      var sy = LINHA[jog.dir] * CEL_H;
      ctx.drawImage(folha, sx, sy, CEL_W, CEL_H,
                    Math.round(px - largura / 2), Math.round(pes - altura),
                    Math.round(largura), Math.round(altura));
    }
  }

  /* ---------------- passo ---------------- */
  function tentarAndar(dir){
    if (jog.andando) return;
    jog.dir = dir;
    var d = PASSO[dir];
    jog.ox = jog.tx; jog.oy = jog.ty;
    jog.tx += d[0]; jog.ty += d[1];
    jog.andando = true;
    jog.t = 0;
    atualizarHud();
  }

  var anterior = 0;
  function laco(agora){
    if (!anterior) anterior = agora;
    var dt = Math.min(64, agora - anterior);
    anterior = agora;

    if (jog.andando){
      jog.t += dt / duracaoPasso;
      /* o ciclo não zera entre passos: a perna continua de onde parou */
      jog.frame = Math.floor((jog.ciclo + jog.t) * FRAMES) % FRAMES;
      if (jog.t >= 1){
        jog.andando = false;
        jog.t = 0;
        jog.ciclo = (jog.ciclo + 1) % 1e6;
        jog.frame = 0;
        atualizarHud();
        if (segurando) tentarAndar(segurando);
      }
    } else {
      jog.frame = 0;
    }

    desenhar();
    requestAnimationFrame(laco);
  }

  function atualizarHud(){
    document.getElementById("hud-pos").textContent = "X " + jog.tx + "  Y " + jog.ty;
    document.getElementById("hud-dir").textContent = jog.dir.toUpperCase();
    var miolo = document.querySelector(".dpad .miolo");
    miolo.textContent = (jog.andando || segurando) ? "ANDANDO" : "PARADO";
  }

  /* ---------------- controles ---------------- */
  var botoes = {};
  Array.prototype.forEach.call(document.querySelectorAll("#dpad [data-dir]"), function(b){
    var dir = b.getAttribute("data-dir");
    botoes[dir] = b;
    b.addEventListener("pointerdown", function(ev){
      ev.preventDefault();
      b.setPointerCapture(ev.pointerId);
      segurando = dir;
      b.classList.add("ativo");
      tentarAndar(dir);
      atualizarHud();
    });
    function soltar(){
      if (segurando === dir) segurando = null;
      b.classList.remove("ativo");
      atualizarHud();
    }
    b.addEventListener("pointerup", soltar);
    b.addEventListener("pointercancel", soltar);
    b.addEventListener("pointerleave", soltar);
  });

  var TECLAS = {
    ArrowUp:"norte", ArrowRight:"leste", ArrowDown:"sul", ArrowLeft:"oeste",
    w:"norte", d:"leste", s:"sul", a:"oeste",
    W:"norte", D:"leste", S:"sul", A:"oeste"
  };
  window.addEventListener("keydown", function(ev){
    var dir = TECLAS[ev.key];
    if (!dir) return;
    ev.preventDefault();
    segurando = dir;
    if (botoes[dir]) botoes[dir].classList.add("ativo");
    tentarAndar(dir);
    atualizarHud();
  });
  window.addEventListener("keyup", function(ev){
    var dir = TECLAS[ev.key];
    if (!dir) return;
    if (segurando === dir) segurando = null;
    if (botoes[dir]) botoes[dir].classList.remove("ativo");
    atualizarHud();
  });

  var vel = document.getElementById("vel"), velVal = document.getElementById("vel-val");
  vel.addEventListener("input", function(){
    duracaoPasso = Number(vel.value);
    velVal.textContent = vel.value + "ms";
  });

  /* ---------------- partida ---------------- */
  redimensionar();
  atualizarHud();
  requestAnimationFrame(laco);
})();
</script>
<!--#artifact-end-->
</body>
</html>
