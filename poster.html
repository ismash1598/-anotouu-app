<head>
<meta charset="utf-8" />

<title>Editor de Pôster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=Bungee&family=Lilita+One&family=Luckiest+Guy&family=Permanent+Marker&family=Shrikhand&family=Titan+One&display=swap" />
<style>
  /* Ferramenta de imagem: assume o escuro de propósito, para a arte saltar.
     Por isso não há bloco de tema claro — todas as cores são pintadas aqui. */
  :root{
    --bg:#13140E;
    --surface:#1C1E15;
    --surface-2:#262A1C;
    --surface-3:#31361F;
    --ink:#EFF1E3;
    --ink-2:#9DA28A;
    --ink-3:#6D7260;
    --line:#333823;
    --line-2:#454B31;
    --accent:#C9F12B;
    --accent-ink:#13140E;
    --perigo:#FF6B5A;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  }
  button,input,textarea,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .app{max-width:540px;margin:0 auto;padding-inline:14px;padding-block:18px 40px}

  header h1{
    margin:0;font-family:"Archivo",sans-serif;font-weight:700;
    font-size:23px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance;
  }
  header p{margin:5px 0 0;color:var(--ink-2);font-size:14px;max-width:46ch}

  .stage{
    margin-top:16px;border-radius:12px;padding:10px;
    background:
      linear-gradient(45deg,#1A1C13 25%,transparent 25%,transparent 75%,#1A1C13 75%),
      linear-gradient(45deg,#1A1C13 25%,transparent 25%,transparent 75%,#1A1C13 75%),
      var(--surface);
    background-size:18px 18px;background-position:0 0,9px 9px;
    border:1px solid var(--line);
    display:flex;justify-content:center;
  }
  canvas{
    width:auto;max-width:100%;max-height:62vh;height:auto;display:block;
    border-radius:3px;box-shadow:0 12px 34px -14px rgba(0,0,0,.9);
    touch-action:none;cursor:grab;
  }
  canvas.arrastando{cursor:grabbing}
  .dica{
    margin:8px 2px 0;color:var(--ink-3);font-size:11.5px;text-align:center;
    letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  }

  .trilha{
    display:flex;gap:7px;overflow-x:auto;padding:14px 2px 4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .trilha::-webkit-scrollbar{display:none}
  .chip{
    flex:none;border:1px solid var(--line-2);background:var(--surface);
    border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500;
    cursor:pointer;white-space:nowrap;color:var(--ink-2);
    max-width:150px;overflow:hidden;text-overflow:ellipsis;
  }
  .chip[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;
  }
  .chip.add{border-style:dashed;color:var(--ink-3)}

  .painel{
    margin-top:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px;
  }
  .rotulo{
    display:block;margin-bottom:7px;font-size:11.5px;font-weight:600;
    letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  }
  .painel textarea, .painel input[type=text]{
    width:100%;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);
    padding:10px 11px;resize:vertical;
  }
  .painel textarea{min-height:66px;line-height:1.4}

  .faixa{display:flex;align-items:center;gap:11px}
  .faixa input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
  .faixa output{
    flex:none;width:46px;text-align:right;font-variant-numeric:tabular-nums;
    font-size:12.5px;color:var(--ink-2);
  }

  .fontes{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .fontes::-webkit-scrollbar{display:none}
  .fonte{
    flex:none;border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;
    padding:9px 13px;font-size:19px;line-height:1.1;cursor:pointer;white-space:nowrap;color:var(--ink-2);
  }
  .fonte[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--surface-3)}

  .cores{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .cor{
    width:34px;height:34px;border-radius:8px;cursor:pointer;
    border:2px solid var(--line-2);padding:0;
  }
  .cor[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
  .cor.livre{
    position:relative;overflow:hidden;
    background:conic-gradient(#F00,#FF0,#0F0,#0FF,#00F,#F0F,#F00);
  }
  .cor.livre input{position:absolute;inset:-6px;opacity:0;cursor:pointer;border:0;padding:0}
  .cor.original{
    background:var(--surface-2);color:var(--ink-2);font-size:10px;font-weight:700;
    width:auto;padding:0 11px;letter-spacing:.06em;
  }

  .linha{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    border:1px solid transparent;border-radius:9px;padding:11px 15px;
    font-weight:600;font-size:14.5px;cursor:pointer;background:var(--accent);color:var(--accent-ink);
  }
  .btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink-2);font-weight:500}
  .btn.perigo{background:transparent;border-color:var(--line-2);color:var(--perigo);font-weight:500}
  .btn.pequeno{padding:8px 12px;font-size:13.5px}
  .btn:active{transform:translateY(1px)}

  .arquivo{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .escolher{
    display:inline-block;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);
    padding:11px 15px;font-weight:600;font-size:14.5px;cursor:pointer;
  }

  .alternar{display:flex;gap:6px;background:var(--surface-2);border-radius:10px;padding:4px}
  .alternar button{
    flex:1;border:0;background:transparent;border-radius:7px;padding:9px 6px;
    font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
  }
  .alternar button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);font-weight:700}

  .acoes{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}

  .aviso{
    margin-top:12px;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5;
    background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);
  }

  .folha{
    position:fixed;inset:0;z-index:40;background:rgba(8,9,6,.84);
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .folha-interna{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;
    max-width:430px;width:100%;max-height:92vh;overflow:auto;
    display:flex;flex-direction:column;gap:11px;
  }
  .folha-interna h2{margin:0;font-size:17px;font-weight:700}
  .folha-interna p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.5}
  .folha-interna img{width:100%;height:auto;border-radius:6px}

  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

</head>
<body>
<!--#artifact-resume-->
<div class="app">
  <header>
    <h1>Editor de pôster</h1>
    <p>Sua imagem de fundo, os títulos do jeito que você quiser e a sua logo, que se move e troca de cor.</p>
  </header>

  <div class="stage">
    <canvas id="poster" aria-label="Pôster"></canvas>
  </div>
  <p class="dica">Arraste na arte para mover · toque para selecionar</p>

  <div class="trilha" id="trilha"></div>
  <div class="painel" id="painel"></div>

  <div class="acoes">
    <button class="btn" type="button" id="exportar">Gerar imagem</button>
    <button class="btn ghost" type="button" id="recomecar">Recomeçar</button>
  </div>

  <p class="aviso" id="aviso" hidden></p>
</div>

<div class="folha" id="folha" hidden>
  <div class="folha-interna">
    <h2>Seu pôster</h2>
    <p>Toque e segure na imagem e escolha “Salvar imagem” (ou “Adicionar às Fotos”).</p>
    <img id="folha-img" alt="Pôster gerado" />
    <button class="btn ghost" type="button" id="folha-fechar">Fechar</button>
  </div>
</div>

      var im = new Image();
      im.onerror = function(){ cb(null); };
      im.onload = function(){
        var s = Math.min(1, maxLado / Math.max(im.width, im.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.width * s));
        c.height = Math.max(1, Math.round(im.height * s));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        try { cb(c.toDataURL(qualidade ? "image/jpeg" : "image/png", qualidade || undefined)); }
        catch(e){ cb(null); }
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* ---------------- geometria ---------------- */
  function fonteDe(c){ return '400 ' + c.tamanho + 'px "' + c.fonte + '", sans-serif'; }

  function caixa(c){
    var p = P();
    if (c.tipo === "logo"){
      var el = img(c.src);
      var prop = el ? el.naturalHeight / el.naturalWidth : .6;
      var w = c.largura * p.w;
      return { w:w, h:w * prop };
    }
    var ls = String(c.texto).split("\n");
    ctx.save();
    ctx.font = fonteDe(c);
    var maxW = 0;
    ls.forEach(function(l){ maxW = Math.max(maxW, ctx.measureText(l).width); });
    ctx.restore();
    var extra = c.contorno ? c.espessura : 0;
    return { w:maxW + extra * 2, h:ls.length * c.tamanho * c.lh + extra * 2, linhas:ls };
  }

  function acerta(c, px, py){
    var p = P(), b = caixa(c);
    var dx = px - c.x * p.w, dy = py - c.y * p.h;
    var a = -(c.rot || 0) * Math.PI / 180;
    var lx = dx * Math.cos(a) - dy * Math.sin(a);
    var ly = dx * Math.sin(a) + dy * Math.cos(a);
    var folga = 14;
    return Math.abs(lx) <= b.w / 2 + folga && Math.abs(ly) <= b.h / 2 + folga;
  }

  /* ---------------- desenho ---------------- */
  function desenhar(exportando){
    var p = P();
    var R = LARGURA_EXPORT / p.w;
    if (canvas.width !== Math.round(p.w * R)){
      canvas.width = Math.round(p.w * R);
      canvas.height = Math.round(p.h * R);
    }
    ctx.setTransform(R, 0, 0, R, 0, 0);
    ctx.clearRect(0, 0, p.w, p.h);

    /* fundo */
    ctx.fillStyle = "#8C8C86";
    ctx.fillRect(0, 0, p.w, p.h);
    var f = estado.fundo;
    var elF = img(f.src);
    if (elF){
      var s = Math.max(p.w / elF.naturalWidth, p.h / elF.naturalHeight) * (f.zoom || 1);
      var dw = elF.naturalWidth * s, dh = elF.naturalHeight * s;
      ctx.drawImage(elF, (p.w - dw) * f.x, (p.h - dh) * f.y, dw, dh);
    } else if (!exportando){
      ctx.save();
      ctx.strokeStyle = "rgba(0,0,0,.14)";
      ctx.lineWidth = 2;
      for (var g = 0; g < p.w + p.h; g += 46){
        ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g - p.h, p.h); ctx.stroke();
      }
      ctx.fillStyle = "rgba(0,0,0,.5)";
      ctx.font = '600 30px "Archivo", sans-serif';
      ctx.textAlign = "center";
      ctx.fillText("toque em Fundo para pôr sua imagem", p.w / 2, p.h / 2 - 150);
      ctx.restore();
    }
    if (f.escurecer){
      ctx.fillStyle = f.escurecer > 0
        ? "rgba(0,0,0," + (f.escurecer / 100) + ")"
        : "rgba(255,255,255," + (-f.escurecer / 100) + ")";
      ctx.fillRect(0, 0, p.w, p.h);
    }

    /* camadas */
    estado.camadas.forEach(function(c){
      ctx.save();
      ctx.translate(c.x * p.w, c.y * p.h);
      if (c.rot) ctx.rotate(c.rot * Math.PI / 180);
      var b = caixa(c);

      if (c.tipo === "logo"){
        var el = img(c.src);
        if (el){
          ctx.globalAlpha = c.opacidade == null ? 1 : c.opacidade;
          var fonteImg = c.original ? el : tingir(el, c.src, c.cor);
          ctx.drawImage(fonteImg, -b.w / 2, -b.h / 2, b.w, b.h);
          ctx.globalAlpha = 1;
        } else {
          ctx.strokeStyle = "rgba(0,0,0,.4)";
          ctx.setLineDash([8, 6]);
          ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
          ctx.setLineDash([]);
        }
      } else {
        ctx.font = fonteDe(c);
        ctx.textBaseline = "middle";
        ctx.textAlign = c.align;
        var ax = c.align === "left" ? -b.w / 2 : c.align === "right" ? b.w / 2 : 0;
        var n = b.linhas.length;
        b.linhas.forEach(function(l, i){
          var yy = (i - (n - 1) / 2) * c.tamanho * c.lh;
          if (c.contorno){
            ctx.lineWidth = c.espessura;
            ctx.strokeStyle = c.corContorno;
            ctx.lineJoin = "round";
            ctx.miterLimit = 2;
            ctx.strokeText(l, ax, yy);
          }
          ctx.fillStyle = c.cor;
          ctx.fillText(l, ax, yy);
        });
      }

      if (!exportando && sel === c.id){
        ctx.strokeStyle = "#C9F12B";
        ctx.lineWidth = 3;
        ctx.setLineDash([11, 8]);
        ctx.strokeRect(-b.w / 2 - 10, -b.h / 2 - 10, b.w + 20, b.h + 20);
        ctx.setLineDash([]);
      }
      ctx.restore();
    });
  }

  /* ---------------- arrastar ---------------- */
  var arrastando = null;
  function ponto(ev){
    var r = canvas.getBoundingClientRect(), p = P();
    return { x:(ev.clientX - r.left) / r.width * p.w, y:(ev.clientY - r.top) / r.height * p.h };
  }

  canvas.addEventListener("pointerdown", function(ev){
    var q = ponto(ev), p = P();
    for (var i = estado.camadas.length - 1; i >= 0; i--){
      var c = estado.camadas[i];
      if (acerta(c, q.x, q.y)){
        if (sel !== c.id){ sel = c.id; montarTrilha(); montarPainel(); }
        arrastando = { c:c, dx:q.x - c.x * p.w, dy:q.y - c.y * p.h };
        canvas.setPointerCapture(ev.pointerId);
        canvas.classList.add("arrastando");
        desenhar();
        return;
      }
    }
    if (sel !== "fundo"){ sel = "fundo"; montarTrilha(); montarPainel(); }
    if (estado.fundo.src){
      arrastando = { fundo:true, px:q.x, py:q.y, x0:estado.fundo.x, y0:estado.fundo.y };
      canvas.setPointerCapture(ev.pointerId);
      canvas.classList.add("arrastando");
    }
    desenhar();
  });

  canvas.addEventListener("pointermove", function(ev){
    if (!arrastando) return;
    var q = ponto(ev), p = P();
    if (arrastando.fundo){
      estado.fundo.x = Math.min(1, Math.max(0, arrastando.x0 - (q.x - arrastando.px) / p.w * 1.6));
      estado.fundo.y = Math.min(1, Math.max(0, arrastando.y0 - (q.y - arrastando.py) / p.h * 1.6));
    } else {
      arrastando.c.x = Math.min(1.15, Math.max(-.15, (q.x - arrastando.dx) / p.w));
      arrastando.c.y = Math.min(1.15, Math.max(-.15, (q.y - arrastando.dy) / p.h));
    }
    desenhar();
  });

  function soltar(){
    if (!arrastando) return;
    arrastando = null;
    canvas.classList.remove("arrastando");
    guardar();
  }
  canvas.addEventListener("pointerup", soltar);
  canvas.addEventListener("pointercancel", soltar);

  /* ---------------- construtores de controle ---------------- */
  function el(tag, cls, texto){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (texto != null) e.textContent = texto;
    return e;
  }

  function campo(rotulo, controle){
    var d = el("div");
    var r = el("label", "rotulo", rotulo);
    d.appendChild(r);
    d.appendChild(controle);
    return d;
  }

  function deslizante(min, max, passo, valor, sufixo, aoMudar){
    var d = el("div", "faixa");
    var i = document.createElement("input");
    i.type = "range"; i.min = min; i.max = max; i.step = passo; i.value = valor;
    var o = el("output", null, valor + sufixo);
    i.addEventListener("input", function(){
      o.textContent = i.value + sufixo;
      aoMudar(Number(i.value));
      desenhar();
    });
    i.addEventListener("change", guardar);
    d.appendChild(i); d.appendChild(o);
    return d;
  }

  function seletorCor(atual, aoMudar, comOriginal, originalAtivo){
    var d = el("div", "cores");
    function marcar(){
      Array.prototype.forEach.call(d.children, function(b){
        var v = b.getAttribute("data-cor");
        var ativo = v === "original" ? !!originalAtivo : (!originalAtivo && v && v.toLowerCase() === atual.toLowerCase());
        b.setAttribute("aria-pressed", ativo ? "true" : "false");
      });
    }
    if (comOriginal){
      var o = el("button", "cor original", "Original");
      o.type = "button";
      o.setAttribute("data-cor", "original");
      o.addEventListener("click", function(){
        originalAtivo = true; aoMudar(null); marcar(); desenhar(); guardar();
      });
      d.appendChild(o);
    }
    PALETA.forEach(function(cor){
      var b = el("button", "cor");
      b.type = "button";
      b.style.background = cor;
      b.setAttribute("data-cor", cor);
      b.setAttribute("aria-label", "Cor " + cor);
      b.addEventListener("click", function(){
        atual = cor; originalAtivo = false; aoMudar(cor); marcar(); desenhar(); guardar();
      });
      d.appendChild(b);
    });
    var livre = el("button", "cor livre");
    livre.type = "button";
    livre.setAttribute("aria-label", "Escolher outra cor");
    var inp = document.createElement("input");
    inp.type = "color";
    inp.value = /^#[0-9a-f]{6}$/i.test(atual) ? atual : "#ffffff";
    inp.addEventListener("input", function(){
      atual = inp.value; originalAtivo = false; aoMudar(inp.value); marcar(); desenhar();
    });
    inp.addEventListener("change", guardar);
    livre.appendChild(inp);
    d.appendChild(livre);
    marcar();
    return d;
  }

  /* Volta completa. O slider sozinho daria ~1,5 grau por pixel de dedo,
     então os atalhos existem para acertar os ângulos retos na unha. */
  function controleGiro(valor, aoMudar){
    var d = el("div");
    var faixa = el("div", "faixa");
    var i = document.createElement("input");
    i.type = "range"; i.min = -180; i.max = 180; i.step = 1; i.value = valor;
    i.setAttribute("aria-label", "Girar em graus");
    var o = el("output", null, valor + "\u00b0");
    faixa.appendChild(i); faixa.appendChild(o);
    d.appendChild(faixa);

    function aplicar(v){
      v = ((v + 180) % 360 + 360) % 360 - 180;
      if (v === -180) v = 180;
      i.value = v;
      o.textContent = v + "\u00b0";
      aoMudar(v); desenhar(); guardar();
    }
    i.addEventListener("input", function(){
      o.textContent = i.value + "\u00b0";
      aoMudar(Number(i.value)); desenhar();
    });
    i.addEventListener("change", guardar);

    var atalhos = el("div", "linha");
    [["0\u00b0", 0], ["90\u00b0", 90], ["180\u00b0", 180], ["\u2212" + "90\u00b0", -90]].forEach(function(par){
      var b = el("button", "btn ghost pequeno", par[0]);
      b.type = "button";
      b.addEventListener("click", function(){ aplicar(par[1]); });
      atalhos.appendChild(b);
    });
    [["\u2212" + "15\u00b0", -15], ["+15\u00b0", 15]].forEach(function(par){
      var b = el("button", "btn ghost pequeno", par[0]);
      b.type = "button";
      b.addEventListener("click", function(){ aplicar(Number(i.value) + par[1]); });
      atalhos.appendChild(b);
    });
    d.appendChild(atalhos);
    return d;
  }

  function alternador(opcoes, atual, aoMudar){
    var d = el("div", "alternar");
    opcoes.forEach(function(op){
      var b = el("button", null, op.nome);
      b.type = "button";
      b.setAttribute("aria-pressed", op.id === atual ? "true" : "false");
      b.addEventListener("click", function(){
        atual = op.id;
        Array.prototype.forEach.call(d.children, function(x, i){
          x.setAttribute("aria-pressed", opcoes[i].id === atual ? "true" : "false");
        });
        aoMudar(op.id); desenhar(); guardar();
      });
      d.appendChild(b);
    });
    return d;
  }

  function botaoArquivo(texto, aoEscolher){
    var l = el("label", "escolher", texto);
    var i = document.createElement("input");
    i.type = "file"; i.accept = "image/*"; i.className = "arquivo";
    i.addEventListener("change", function(){
      var f = i.files && i.files[0];
      if (!f) return;
      l.firstChild.nodeValue = "Carregando...";
      aoEscolher(f, function(ok){ l.firstChild.nodeValue = ok ? texto : "Não deu para ler essa imagem"; });
    });
    l.appendChild(i);
    return l;
  }

  /* ---------------- trilha de camadas ---------------- */
  function nomeCamada(c){
    if (c.tipo === "logo") return "Logo";
    return String(c.texto).split("\n")[0].slice(0, 18) || "Texto";
  }

  function montarTrilha(){
    var t = document.getElementById("trilha");
    t.innerHTML = "";
    var bf = el("button", "chip", "Fundo");
    bf.type = "button";
    bf.setAttribute("aria-pressed", sel === "fundo" ? "true" : "false");
    bf.addEventListener("click", function(){ sel = "fundo"; montarTrilha(); montarPainel(); desenhar(); });
    t.appendChild(bf);

    estado.camadas.forEach(function(c){
      var b = el("button", "chip", nomeCamada(c));
      b.type = "button";
      b.setAttribute("aria-pressed", sel === c.id ? "true" : "false");
      b.addEventListener("click", function(){ sel = c.id; montarTrilha(); montarPainel(); desenhar(); });
      t.appendChild(b);
    });

    var bt = el("button", "chip add", "+ Texto");
    bt.type = "button";
    bt.addEventListener("click", function(){
      var c = { id:proximoId++, tipo:"texto", texto:"NOVO TEXTO", fonte:"Luckiest Guy",
                tamanho:70, cor:"#FFFFFF", contorno:false, corContorno:"#111111", espessura:8,
                x:.5, y:.5, rot:0, lh:1.1, align:"center" };
      estado.camadas.push(c); sel = c.id;
      montarTrilha(); montarPainel(); desenhar(); guardar();
    });
    t.appendChild(bt);

    var bl = el("button", "chip add", "+ Logo");
    bl.type = "button";
    bl.addEventListener("click", function(){
      var c = { id:proximoId++, tipo:"logo", src:LOGO, cor:"#FFFFFF", original:false,
                largura:.35, x:.5, y:.5, rot:0, opacidade:1 };
      estado.camadas.push(c); sel = c.id;
      montarTrilha(); montarPainel(); desenhar(); guardar();
    });
    t.appendChild(bl);
  }

  /* ---------------- painel ---------------- */
  function ordenar(c, dir){
    var i = estado.camadas.indexOf(c);
    var j = i + dir;
    if (j < 0 || j >= estado.camadas.length) return;
    estado.camadas.splice(i, 1);
    estado.camadas.splice(j, 0, c);
    montarTrilha(); desenhar(); guardar();
  }

  function apagar(c){
    estado.camadas = estado.camadas.filter(function(x){ return x !== c; });
    sel = estado.camadas.length ? estado.camadas[estado.camadas.length - 1].id : "fundo";
    montarTrilha(); montarPainel(); desenhar(); guardar();
  }

  function montarPainel(){
    var pn = document.getElementById("painel");
    pn.innerHTML = "";

    if (sel === "fundo"){
      pn.appendChild(campo("Formato", alternador(
        FORMATOS.map(function(f){ return { id:f.id, nome:f.nome }; }),
        estado.formato,
        function(v){ estado.formato = v; }
      )));

      var linhaF = el("div", "linha");
      linhaF.appendChild(botaoArquivo(estado.fundo.src ? "Trocar imagem" : "Escolher imagem", function(f, pronto){
        reduzir(f, 1500, .85, function(dados){
          if (!dados){ pronto(false); return; }
          estado.fundo.src = dados;
          estado.fundo.zoom = 1; estado.fundo.x = .5; estado.fundo.y = .5;
          pronto(true); desenhar(); guardar(); montarPainel();
        });
      }));
      if (estado.fundo.src){
        var limpar = el("button", "btn ghost", "Tirar imagem");
        limpar.type = "button";
        limpar.addEventListener("click", function(){
          estado.fundo.src = null; desenhar(); guardar(); montarPainel();
        });
        linhaF.appendChild(limpar);
      }
      pn.appendChild(campo("Imagem de fundo", linhaF));

      pn.appendChild(campo("Aproximar", deslizante(100, 300, 1, Math.round((estado.fundo.zoom || 1) * 100), "%",
        function(v){ estado.fundo.zoom = v / 100; })));
      pn.appendChild(campo("Escurecer ou clarear", deslizante(-70, 70, 1, estado.fundo.escurecer || 0, "",
        function(v){ estado.fundo.escurecer = v; })));

      var nota = el("p", "aviso", estado.fundo.src
        ? "Arraste na arte, fora dos textos, para reposicionar o fundo."
        : "Sem imagem, o pôster usa o cinza de fundo. As listras só aparecem aqui na tela, não na imagem gerada.");
      pn.appendChild(nota);
      return;
    }

    var c = acharCamada(sel);
    if (!c){ sel = "fundo"; montarPainel(); return; }

    if (c.tipo === "texto"){
      var ta = document.createElement("textarea");
      ta.value = c.texto;
      ta.setAttribute("aria-label", "Texto");
      ta.addEventListener("input", function(){
        c.texto = ta.value;
        desenhar();
        var chips = document.getElementById("trilha").children;
        for (var i = 0; i < chips.length; i++){
          if (chips[i].getAttribute("aria-pressed") === "true" && chips[i].textContent !== "Fundo"){
            chips[i].textContent = nomeCamada(c); break;
          }
        }
      });
      ta.addEventListener("change", guardar);
      ta.addEventListener("blur", guardar);
      pn.appendChild(campo("Texto", ta));

      var fs = el("div", "fontes");
      FONTES.forEach(function(nome){
        var b = el("button", "fonte", "Aa");
        b.type = "button";
        b.style.fontFamily = '"' + nome + '", sans-serif';
        b.title = nome;
        b.setAttribute("aria-label", "Fonte " + nome);
        b.setAttribute("aria-pressed", c.fonte === nome ? "true" : "false");
        b.addEventListener("click", function(){
          c.fonte = nome;
          Array.prototype.forEach.call(fs.children, function(x, i){
            x.setAttribute("aria-pressed", FONTES[i] === nome ? "true" : "false");
          });
          desenhar(); guardar();
        });
        fs.appendChild(b);
      });
      pn.appendChild(campo("Fonte", fs));

      pn.appendChild(campo("Cor", seletorCor(c.cor, function(v){ c.cor = v; })));
      pn.appendChild(campo("Tamanho", deslizante(16, 260, 1, c.tamanho, "", function(v){ c.tamanho = v; })));
      pn.appendChild(campo("Alinhamento", alternador(
        [{ id:"left", nome:"Esquerda" }, { id:"center", nome:"Centro" }, { id:"right", nome:"Direita" }],
        c.align, function(v){ c.align = v; })));
      pn.appendChild(campo("Entrelinha", deslizante(70, 200, 1, Math.round(c.lh * 100), "%",
        function(v){ c.lh = v / 100; })));
      pn.appendChild(campo("Girar", controleGiro(c.rot, function(v){ c.rot = v; })));

      var alterna = alternador(
        [{ id:"nao", nome:"Sem contorno" }, { id:"sim", nome:"Com contorno" }],
        c.contorno ? "sim" : "nao",
        function(v){ c.contorno = v === "sim"; montarPainel(); });
      pn.appendChild(campo("Contorno", alterna));
      if (c.contorno){
        pn.appendChild(campo("Cor do contorno", seletorCor(c.corContorno, function(v){ c.corContorno = v; })));
        pn.appendChild(campo("Espessura", deslizante(2, 30, 1, c.espessura, "", function(v){ c.espessura = v; })));
      }
    } else {
      var linhaL = el("div", "linha");
      linhaL.appendChild(botaoArquivo("Trocar a imagem", function(f, pronto){
        reduzir(f, 1200, 0, function(dados){
          if (!dados){ pronto(false); return; }
          c.src = dados; pronto(true); desenhar(); guardar();
        });
      }));
      var voltar = el("button", "btn ghost", "Usar a minha logo");
      voltar.type = "button";
      voltar.addEventListener("click", function(){ c.src = LOGO; desenhar(); guardar(); });
      linhaL.appendChild(voltar);
      pn.appendChild(campo("Imagem", linhaL));

      pn.appendChild(campo("Cor", seletorCor(c.cor, function(v){
        if (v === null){ c.original = true; } else { c.original = false; c.cor = v; }
      }, true, c.original)));
      pn.appendChild(campo("Tamanho", deslizante(8, 100, 1, Math.round(c.largura * 100), "%",
        function(v){ c.largura = v / 100; })));
      pn.appendChild(campo("Girar", controleGiro(c.rot, function(v){ c.rot = v; })));
      pn.appendChild(campo("Opacidade", deslizante(10, 100, 1, Math.round((c.opacidade == null ? 1 : c.opacidade) * 100), "%",
        function(v){ c.opacidade = v / 100; })));
    }

    var acoes = el("div", "linha");
    var frente = el("button", "btn ghost pequeno", "Trazer à frente");
    frente.type = "button";
    frente.addEventListener("click", function(){ ordenar(c, 1); });
    var atras = el("button", "btn ghost pequeno", "Mandar atrás");
    atras.type = "button";
    atras.addEventListener("click", function(){ ordenar(c, -1); });
    var dup = el("button", "btn ghost pequeno", "Duplicar");
    dup.type = "button";
    dup.addEventListener("click", function(){
      var n = JSON.parse(JSON.stringify(c));
      n.id = proximoId++;
      n.y = Math.min(1, n.y + .06);
      estado.camadas.push(n); sel = n.id;
      montarTrilha(); montarPainel(); desenhar(); guardar();
    });
    var del = el("button", "btn perigo pequeno", "Apagar");
    del.type = "button";
    del.addEventListener("click", function(){ apagar(c); });
    acoes.appendChild(frente); acoes.appendChild(atras);
    acoes.appendChild(dup); acoes.appendChild(del);
    pn.appendChild(acoes);
  }

  /* ---------------- exportar ---------------- */
  var folha = document.getElementById("folha");
  document.getElementById("exportar").addEventListener("click", function(){
    desenhar(true);
    var dados;
    try { dados = canvas.toDataURL("image/png"); } catch(e){ desenhar(); return; }
    desenhar();
    document.getElementById("folha-img").src = dados;
    folha.hidden = false;
  });
